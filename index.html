<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASCII Wireframes</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A specification and tooling for ASCII wireframes - the de facto standard for communicating UX/UI design with AI coding assistants.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2c3e50;
      --code-theme-background: #f8f8f8;
    }
    /* Make ASCII art more readable */
    pre[data-lang=""] code,
    pre code {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      line-height: 1.2;
    }
    /* Style for HTML previews in tabs */
    .docsify-tabs__content[data-tab="preview"] {
      border: 1px solid #ddd;
      padding: 16px;
      background: white;
      min-height: 100px;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'ASCII Wireframes',
      repo: 'https://github.com/Morton/ascii-wireframes',
      loadSidebar: true,
      subMaxLevel: 2,
      homepage: 'README.md',
      auto2top: true,
      search: {
        placeholder: 'Search...',
        noData: 'No results found.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      tabs: {
        persist: false,
        sync: false,
        theme: 'classic',
        tabComments: true,
        tabHeadings: true
      }
    }
  </script>
  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy code plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Emoji plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <!-- Tabs plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
</body>
</html>
